# Shared settings for every Qwen3-0.6B / DAPO-Math-17k experiment.
#
# The batching knobs below describe the GRPO *baseline*. A CPPO config only
# sets `pruning_rate`; the pipeline derives the batch geometry from it (see
# cppo/geometry.py), so the update stage keeps the same tensor shapes and the
# comparison stays apples-to-apples.
#
# Reference hardware: 1x NVIDIA A100/H100 80GB.

model_name_or_path: Qwen/Qwen3-0.6B
torch_dtype: bfloat16
# SDPA is the default because it needs no extra build step and works on every
# CUDA generation. flash_attention_2 is ~10-15% faster on the update stage but
# requires `pip install flash-attn --no-build-isolation` (Ampere or newer);
# pass --attn-implementation flash_attention_2 once it is installed.
attn_implementation: sdpa
gradient_checkpointing: true

dataset_name: open-r1/DAPO-Math-17k-Processed
dataset_config: en
dataset_split: train
prompt_style: boxed
# Qwen3 is a hybrid thinking model. Left on, a 0.6B policy reasons past any
# affordable completion budget: every completion truncates, none reaches a
# \boxed{} answer, and truncation masking then zeroes the entire gradient.
# Off for both training and evaluation, so the prompt formats agree.
enable_thinking: false
# One pass over a fixed 8k-problem subset. Both algorithms consume exactly the
# same problems, which is what makes the wall-clock comparison meaningful.
max_samples: 8192
max_prompt_length: 640
max_completion_length: 1024

# Rollout-stage acceleration. This is the half of the task CPPO does not
# address: CPPO prunes the update stage, while the rollout is accelerated by
#   * vLLM with PagedAttention and continuous batching, in colocate mode so
#     the sampler shares the training process rather than needing a second
#     GPU (kwon2023vllm);
#   * sleep mode, which releases the vLLM KV cache and weights between
#     rollouts so the sampler and the optimiser never hold memory at once;
#   * CPPO's own dynamic completion allocation, which enlarges the generation
#     batch by m = G // k and so raises sampler occupancy for free.
num_generations: 8
temperature: 1.0
top_p: 1.0
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3
vllm_tensor_parallel_size: 1
vllm_enable_sleep_mode: true
# G = 8 completions per question.
# CPPO can only prune *before* every forward pass if no forward pass precedes
# the advantage computation. Turning the importance-sampling correction off
# removes TRL's extra old-policy forward; see cppo/trainer.py for the details.
vllm_importance_sampling_correction: false

# Objective: KL-free (beta = 0), which is both TRL's default and the
# approximation the CPPO paper derives its pruning criterion from (Eq. 6).
beta: 0.0
epsilon: 0.2
epsilon_high: 0.28
loss_type: dapo
scale_rewards: group

learning_rate: 1.0e-6
lr_scheduler_type: constant_with_warmup
# Expressed for the m = 1 baseline. The pipeline divides it by the allocation
# multiplier so every run warms up over the same fraction of its schedule --
# otherwise CPPO at P=0.875 (8x fewer steps) would spend 16% of its run at a
# reduced learning rate against the baseline's 2%.
warmup_steps: 10
weight_decay: 0.0
max_grad_norm: 0.2
adam_beta1: 0.9
adam_beta2: 0.99
num_train_epochs: 1.0

# Baseline update-stage shape: 16 completions per device per micro-batch,
# 8 micro-batches per optimiser step => 128 completions = 16 questions/round.
per_device_train_batch_size: 16
gradient_accumulation_steps: 8

logging_steps: 1
save_steps: 0
save_final_model: true
report_to: []
seed: 42
