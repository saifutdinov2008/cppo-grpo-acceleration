name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The eval extra is installed too: `cppo.evaluate` imports `lm_eval`
      # lazily, and pylint would otherwise report it as an unresolved import.
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[eval,dev]"

      - name: pylint
        run: python -m pylint src/cppo tests benchmarks

      - name: mypy (strict)
        run: python -m mypy

      # The `slow` tests download a tiny two-layer checkpoint from the Hub and
      # run real GRPO and CPPO steps on CPU. Together with the config tests,
      # which load and validate every file in configs/, they are the
      # end-to-end guard.
      - name: pytest
        run: python -m pytest tests -q

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
